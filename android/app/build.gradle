plugins {
    id 'com.android.application'
}

android {
    namespace 'net.smalltalkapps.chatbotjames'
    compileSdk 36

    defaultConfig {
        applicationId "net.smalltalkapps.chatbotjames"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName "1.0.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file('../key/chatbotjames.jks')
            storePassword 'weliketodrinkcoffee'
            keyAlias 'chatbotjames'
            keyPassword 'weliketodrinkcoffee'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.12.0'
}
