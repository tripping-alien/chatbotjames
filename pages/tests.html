<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAMES Tool Router — Browser Unit Tests</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-muted: #8b949e;
            --accent-cyan: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-yellow: #d29922;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Consolas, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
            background: var(--bg-color);
            color: var(--text-primary);
            padding: 24px;
            min-height: 100vh;
            line-height: 1.5;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 1.4rem;
            color: var(--accent-cyan);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .protocol-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            background: rgba(88, 166, 255, 0.1);
        }

        .btn-primary {
            background: #238636;
            border-color: #2ea043;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #2ea043;
            border-color: #3fb950;
            color: #ffffff;
        }

        /* Stats summary card */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .stat-val {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .val-total { color: var(--text-primary); }
        .val-pass  { color: var(--accent-green); }
        .val-fail  { color: var(--accent-red); }
        .val-time  { color: var(--accent-cyan); }

        /* Filter & Search Bar */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .filter-tabs {
            display: flex;
            gap: 6px;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            transition: all 0.15s ease;
        }

        .filter-btn.active {
            background: rgba(88, 166, 255, 0.15);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            font-weight: bold;
        }

        .search-input {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.85rem;
            width: 260px;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .search-input:focus {
            border-color: var(--accent-cyan);
        }

        /* Error Banner */
        .error-card {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid var(--accent-red);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .error-card h3 {
            color: var(--accent-red);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .error-card pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            overflow-x: auto;
            font-size: 0.85rem;
            color: #ff7b72;
        }

        .error-tips {
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .error-tips code {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--accent-cyan);
        }

        /* Output & Test cases */
        #output {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .tool-group {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .tool-group-header {
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tool-name {
            font-weight: 700;
            color: var(--accent-cyan);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-count-badge {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
        }

        .test-list {
            padding: 8px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .test-item {
            font-size: 0.85rem;
            padding: 4px 6px;
            border-radius: 4px;
            display: flex;
            align-items: baseline;
            gap: 8px;
            word-break: break-word;
        }

        .test-item.pass {
            color: #3fb950;
        }

        .test-item.fail {
            color: #f85149;
            background: rgba(248, 81, 73, 0.1);
        }

        .status-glyph {
            font-weight: 700;
            width: 14px;
            display: inline-block;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 0.95rem;
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            border-radius: 6px;
        }

        .loading-state {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-cyan);
            padding: 20px;
            font-size: 1rem;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(88, 166, 255, 0.2);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title-wrap">
            <h1>🔧 JAMES Tool Router Unit Tests</h1>
            <span id="protocolBadge" class="protocol-badge">Initializing...</span>
        </div>
        <div class="header-controls">
            <a href="../index.html" class="btn">← Back to Chat</a>
            <button id="rerunBtn" class="btn btn-primary" onclick="runTests()">↻ Re-run Tests</button>
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat-card">
            <span class="stat-label">Total Tests</span>
            <span id="statTotal" class="stat-val val-total">0</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Passed</span>
            <span id="statPassed" class="stat-val val-pass">0</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Failed</span>
            <span id="statFailed" class="stat-val val-fail">0</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Duration</span>
            <span id="statDuration" class="stat-val val-time">0ms</span>
        </div>
    </div>

    <div class="toolbar">
        <div class="filter-tabs">
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All (<span id="countAll">0</span>)</button>
            <button class="filter-btn" data-filter="pass" onclick="setFilter('pass')">Passed (<span id="countPass">0</span>)</button>
            <button class="filter-btn" data-filter="fail" onclick="setFilter('fail')">Failed (<span id="countFail">0</span>)</button>
        </div>
        <input type="text" id="filterInput" class="search-input" placeholder="Search tests or tools..." oninput="onSearchInput(this.value)">
    </div>

    <div id="errorContainer"></div>
    <div id="output">
        <div class="loading-state">
            <div class="spinner"></div>
            <span>Running test suite...</span>
        </div>
    </div>

    <!-- 1. Early diagnostic error listeners before any module or script runs -->
    <script>
        window.addEventListener('error', function(event) {
            showDiagnosticError(event.error || event.message, event.filename, event.lineno);
        });

        window.addEventListener('unhandledrejection', function(event) {
            showDiagnosticError(event.reason || 'Unhandled Promise Rejection');
        });

        function showDiagnosticError(err, filename, lineno) {
            const container = document.getElementById('errorContainer');
            if (!container) return;
            const isFile = window.location.protocol === 'file:';
            const msg = err && err.message ? err.message : String(err || 'Unknown error');
            const stack = err && err.stack ? err.stack : '';

            container.innerHTML = `
                <div class="error-card">
                    <h3>⚠️ Test Runner Error</h3>
                    <div><strong>Message:</strong> ${escapeHtml(msg)} ${lineno ? `(line ${lineno})` : ''}</div>
                    ${stack ? `<pre>${escapeHtml(stack)}</pre>` : ''}
                    <div class="error-tips">
                        ${isFile ? `
                            <strong>Why this happened:</strong> You opened this file using the <code>file:///</code> protocol.
                            Modern browsers (Chrome, Edge, Firefox, Safari) strictly block ES module imports over <code>file://</code>.<br><br>
                            <strong>Solution:</strong> Run a lightweight local HTTP server from the project directory:
                            <br><code>npx serve .</code> or <code>python -m http.server 8000</code> or use VS Code Live Server.
                        ` : `
                            Verify network connectivity and ensure the local project files are intact.
                        `}
                    </div>
                </div>
            `;
            const output = document.getElementById('output');
            if (output) output.innerHTML = '';
        }

        function escapeHtml(s) {
            return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>

    <!-- 2. Standalone tool router bundle for 100% offline & file:/// execution -->
    <script src="../tools/tool-router-bundle.js"></script>

    <!-- 3. Test Runner Logic with dynamic module fallback and real-time filtering -->
    <script>
        let allResults = [];
        let currentFilter = 'all';
        let searchQuery = '';

        async function resolveToolRouter() {
            // Priority 1: Check if standalone bundle loaded (works under both file:/// and http://)
            if (window.JAMES_TOOL_ROUTER && window.JAMES_TOOL_ROUTER.toolRouter && window.JAMES_TOOL_ROUTER.ALL_RULES) {
                return window.JAMES_TOOL_ROUTER;
            }

            // Priority 2: Fall back to dynamic ES module import when served over HTTP/HTTPS
            try {
                const routerMod = await import('../tools/router.js');
                if (routerMod && routerMod.toolRouter && routerMod.ALL_RULES) {
                    return routerMod;
                }
            } catch (moduleErr) {
                console.warn('ES module dynamic import failed:', moduleErr);
            }

            throw new Error('Could not load tool router. Neither bundled nor ES module router is available.');
        }

        async function runTests() {
            const output = document.getElementById('output');
            const errorContainer = document.getElementById('errorContainer');
            const badge = document.getElementById('protocolBadge');
            
            if (errorContainer) errorContainer.innerHTML = '';
            output.innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <span>Running test suite...</span>
                </div>
            `;

            const isFile = window.location.protocol === 'file:';
            if (badge) {
                badge.textContent = isFile ? 'Mode: Standalone / file://' : 'Mode: HTTP / Web Server';
                badge.style.borderColor = isFile ? 'var(--accent-yellow)' : 'var(--accent-green)';
                badge.style.color = isFile ? 'var(--accent-yellow)' : 'var(--accent-green)';
            }

            const startTime = performance.now();

            try {
                const { toolRouter, ALL_RULES } = await resolveToolRouter();
                allResults = [];
                let total = 0, passed = 0;

                for (const rule of ALL_RULES) {
                    const group = {
                        tool: rule.tool,
                        description: rule.description || '',
                        cases: []
                    };

                    const examples = rule.examples || [];
                    if (examples.length === 0) {
                        group.cases.push({
                            example: '(No examples configured)',
                            status: 'pass',
                            message: 'No examples configured'
                        });
                    }

                    for (const example of examples) {
                        total++;
                        let matchResult = null;
                        let errorMsg = null;

                        try {
                            matchResult = toolRouter.match(example);
                        } catch (err) {
                            errorMsg = err.message;
                        }

                        const isMatch = matchResult && matchResult.tool === rule.tool;
                        if (isMatch) {
                            passed++;
                            group.cases.push({
                                example,
                                status: 'pass',
                                targetTool: rule.tool,
                                routedTool: matchResult.tool
                            });
                        } else {
                            const got = matchResult ? matchResult.tool : (errorMsg ? `ERROR: ${errorMsg}` : 'NULL');
                            group.cases.push({
                                example,
                                status: 'fail',
                                targetTool: rule.tool,
                                routedTool: got
                            });
                        }
                    }

                    allResults.push(group);
                }

                const duration = Math.round(performance.now() - startTime);
                const failed = total - passed;

                document.getElementById('statTotal').textContent = total;
                document.getElementById('statPassed').textContent = passed;
                document.getElementById('statFailed').textContent = failed;
                document.getElementById('statDuration').textContent = `${duration}ms`;

                document.getElementById('countAll').textContent = total;
                document.getElementById('countPass').textContent = passed;
                document.getElementById('countFail').textContent = failed;

                renderResults();
            } catch (err) {
                showDiagnosticError(err);
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-filter') === filter);
            });
            renderResults();
        }

        function onSearchInput(query) {
            searchQuery = query.toLowerCase().trim();
            renderResults();
        }

        function renderResults() {
            const output = document.getElementById('output');
            output.innerHTML = '';

            let renderedGroups = 0;

            for (const group of allResults) {
                // Filter test cases in this group
                const matchingCases = group.cases.filter(c => {
                    if (currentFilter === 'pass' && c.status !== 'pass') return false;
                    if (currentFilter === 'fail' && c.status !== 'fail') return false;
                    if (searchQuery) {
                        const inExample = c.example.toLowerCase().includes(searchQuery);
                        const inTool = group.tool.toLowerCase().includes(searchQuery);
                        const inTarget = (c.targetTool || '').toLowerCase().includes(searchQuery);
                        const inRouted = (c.routedTool || '').toLowerCase().includes(searchQuery);
                        if (!inExample && !inTool && !inTarget && !inRouted) return false;
                    }
                    return true;
                });

                if (matchingCases.length === 0) continue;
                renderedGroups++;

                const groupEl = document.createElement('div');
                groupEl.className = 'tool-group';

                const headerEl = document.createElement('div');
                headerEl.className = 'tool-group-header';
                headerEl.innerHTML = `
                    <div class="tool-name">
                        <span>🔨 [${escapeHtml(group.tool)}]</span>
                    </div>
                    <span class="tool-count-badge">${matchingCases.length} test${matchingCases.length === 1 ? '' : 's'}</span>
                `;
                groupEl.appendChild(headerEl);

                const listEl = document.createElement('div');
                listEl.className = 'test-list';

                matchingCases.forEach(c => {
                    const item = document.createElement('div');
                    item.className = `test-item ${c.status}`;
                    if (c.status === 'pass') {
                        item.innerHTML = `<span class="status-glyph">✓</span> <span>PASS: "${escapeHtml(c.example)}" &rarr; <strong>${escapeHtml(c.routedTool || c.targetTool)}</strong></span>`;
                    } else {
                        item.innerHTML = `<span class="status-glyph">✗</span> <span>FAIL: "${escapeHtml(c.example)}" &rarr; expected <strong>${escapeHtml(c.targetTool)}</strong>, got <strong>${escapeHtml(c.routedTool)}</strong></span>`;
                    }
                    listEl.appendChild(item);
                });

                groupEl.appendChild(listEl);
                output.appendChild(groupEl);
            }

            if (renderedGroups === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.textContent = searchQuery
                    ? `No tests match search "${searchQuery}".`
                    : `No tests found for filter [${currentFilter}].`;
                output.appendChild(empty);
            }
        }

        // Auto-run tests when page loads
        document.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
